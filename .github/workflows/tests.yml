name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (offline, stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Offline smoke (fake adapter, no network, no GPU)
        if: matrix.python == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          python cli.py generate --out /tmp/xbench-corpus
          python cli.py run --model fake --corpus /tmp/xbench-corpus
          python cli.py score --corpus /tmp/xbench-corpus
